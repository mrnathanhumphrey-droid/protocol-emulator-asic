# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"      # Project title
  author:       "Nathan Humphrey"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Table-driven protocol emulator with a formally synthesized timing envelope"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x4"          # v2 canary: 8x4 confirmed final for the March shuttle
                        # NB the template comment lists only 1x1..8x2 -- the two
                        # primary sources CONFLICT; this push is the experiment.

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "pe_engine.v"
    - "pe_store.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "TX queue tag bit 0 (run mode) - latched with the HIGH nibble"
  ui[1]: "TX payload nibble bit 0 (run mode) - 2 pushes per byte, HIGH nibble first"
  ui[2]: "TX payload nibble bit 1"
  ui[3]: "TX payload nibble bit 2"
  ui[4]: "TX payload nibble bit 3"
  ui[5]: "load: PTR_RST - reset the program write pointer | run: TX queue tag bit 1"
  ui[6]: "load: WR - rising edge writes uio[7:0] at the pointer, then auto-increments | run: TX payload PUSH"
  ui[7]: "PROG_MODE - 1 = load a program, 0 = run"

  # Outputs
  uo[0]: "UART-tx TX, push-pull"
  uo[1]: "SPI-master SCLK, push-pull"
  uo[2]: "SPI-master MOSI, push-pull"
  uo[3]: "SPI-master CS, push-pull"
  uo[4]: "serial host view: DATA"
  uo[5]: "serial host view: STROBE"
  uo[6]: "serial host view: VALID"
  uo[7]: "spare (reads 0)"

  # Bidirectional pins
  uio[0]: "load data bit 0 (load mode) / SPI-master MISO, input"
  uio[1]: "load data bit 1 (load mode) / I2C SCL, open-drain"
  uio[2]: "load data bit 2 (load mode) / I2C SDA, open-drain"
  uio[3]: "load data bit 3 (load mode) / UART-rx RX, input"
  uio[4]: "load data bit 4 (load mode) / SPI-target SCLK, input"
  uio[5]: "load data bit 5 (load mode) / SPI-target MOSI, input"
  uio[6]: "load data bit 6 (load mode) / SPI-target CS, input"
  uio[7]: "load data bit 7 (load mode) / SPI-target MISO, tri-state (async release on CS)"

# Do not change!
yaml_version: 6
