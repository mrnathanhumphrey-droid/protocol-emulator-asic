# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"      # Project title
  author:       "Nathan Humphrey"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Table-driven protocol emulator with a formally synthesized timing envelope"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Jane Street brief: "Set the tile size in info.yaml to 6x4."
                        # NB the template comment lists only 1x1..8x2 -- the two
                        # primary sources CONFLICT; this push is the experiment.

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "unused"
  ui[1]: "unused"
  ui[2]: "unused"
  ui[3]: "unused"
  ui[4]: "unused"
  ui[5]: "PTR_RST - reset the program write pointer (load mode)"
  ui[6]: "WR - rising edge writes uio[7:0] at the pointer, then auto-increments"
  ui[7]: "PROG_MODE - 1 = load a program, 0 = run"

  # Outputs
  uo[0]: "pointer echo bit 0 (load mode) / program readback bit 0 (run mode)"
  uo[1]: "pointer echo bit 1 / program readback bit 1"
  uo[2]: "pointer echo bit 2 / program readback bit 2"
  uo[3]: "pointer echo bit 3 / program readback bit 3"
  uo[4]: "pointer echo bit 4 / program readback bit 4"
  uo[5]: "pointer echo bit 5 / program readback bit 5"
  uo[6]: "program readback bit 6 (run mode)"
  uo[7]: "program readback bit 7 (run mode)"

  # Bidirectional pins
  uio[0]: "load data bit 0 (load mode) / I2C SCL, open-drain (run mode)"
  uio[1]: "load data bit 1 (load mode) / I2C SDA, open-drain (run mode)"
  uio[2]: "load data bit 2 (load mode) / reserved for protocol pins"
  uio[3]: "load data bit 3 (load mode) / reserved for protocol pins"
  uio[4]: "load data bit 4 (load mode) / reserved for protocol pins"
  uio[5]: "load data bit 5 (load mode) / reserved for protocol pins"
  uio[6]: "load data bit 6 (load mode) / reserved for protocol pins"
  uio[7]: "load data bit 7 (load mode) / reserved for protocol pins"

# Do not change!
yaml_version: 6
