name: harden-setup
description: "harden.yml: the pinned flow (tt-support-tools 9d13ff3, LibreLane 3.1.0.dev4, PDK from ci/pdk.sha, cached) and the merged config for one design directory"
inputs:
  wd:
    description: "design directory (. = the chip, ci/harden/smoke = the smoke design)"
    required: true
  coef:
    description: "PL_WIRE_LENGTH_COEF for the chip (ignored for the smoke design)"
    required: true
  cfg:
    description: "chip only: JSON object of src/config.json overrides for a variant (default none)"
    required: false
    default: "{}"
  en:
    description: "chip only: fallback-ladder defaults for src/project.v, e.g. EN_SYMGEN=0,EN_FLAGS=0 (default none = all 1)"
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: tt-support-tools at the pinned SHA
      uses: actions/checkout@v6
      with:
        repository: TinyTapeout/tt-support-tools
        ref: 9d13ff3e3e6202090740110438c6a10c1d62ca0f
        path: ${{ inputs.wd }}/tt

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip

    - name: Python packages (tt tools + LibreLane, pinned)
      shell: bash
      run: pip install -q -r "${{ inputs.wd }}/tt/requirements.txt" "librelane==3.1.0.dev4"

    # ⭐ CACHED, NOT DOWNLOADED EVERY RUN (Wilson 11-25 load controls): the PDK store keyed by its pinned hash.
    - name: PDK cache
      id: pdkc
      uses: actions/cache@v4
      with:
        path: /home/runner/pdk
        key: pdk-ihp-sg13-${{ hashFiles('ci/pdk.sha') }}

    - name: PDK fetch (cache miss only)
      if: steps.pdkc.outputs.cache-hit != 'true'
      shell: bash
      run: ciel fetch --pdk-root /home/runner/pdk --pdk-family ihp-sg13 "$(tr -d '[:space:]' < ci/pdk.sha)"

    - name: Merged config
      shell: bash
      working-directory: ${{ inputs.wd }}
      env: {IN_COEF: "${{ inputs.coef }}", IN_CFG: "${{ inputs.cfg }}", IN_EN: "${{ inputs.en }}"}
      run: |
        set -euo pipefail
        if [ "${{ inputs.wd }}" = "." ]; then
          python3 - <<'PY'
        import json, os, re, sys
        p = "src/config.json"; c = json.load(open(p)); c["PL_WIRE_LENGTH_COEF"] = float(os.environ["IN_COEF"])
        print("PL_WIRE_LENGTH_COEF", c["PL_WIRE_LENGTH_COEF"])
        # ⭐ OPENROAD_THREADS PINNED (Wilson 11-26): placement's results can depend on the thread count, and
        # box 2 (the 67 % line's calibration runs) used 3; unset, a GitHub runner uses all 4. One value for
        # every run, so the line, the controls and sign-off share one flow. A variant may still override it.
        c["OPENROAD_THREADS"] = 3
        print("OPENROAD_THREADS", c["OPENROAD_THREADS"], "(pinned)")
        # a variant's config overrides (Wilson 11-25 step 1): printed, so the run log names what ran
        over = json.loads(os.environ.get("IN_CFG") or "{}")
        if not isinstance(over, dict):
            sys.exit("cfg must be a JSON object, got %r" % over)
        for k, v in over.items():
            print("override %s: %r -> %r" % (k, c.get(k), v)); c[k] = v
        json.dump(c, open(p, "w"), indent=2)
        # the fallback ladder (src/project.v EN_* defaults): each named switch must exist, 0 or 1
        en = [x.strip() for x in (os.environ.get("IN_EN") or "").split(",") if x.strip()]
        if en:
            v = open("src/project.v", encoding="utf-8").read()
            for item in en:
                m = re.fullmatch(r"(EN_SLOTBUF|EN_SYMGEN|EN_FLAGS|EN_DS)=([01])", item)
                if not m:
                    sys.exit("en: bad item %r (EN_SLOTBUF|EN_SYMGEN|EN_FLAGS|EN_DS = 0|1)" % item)
                v, n = re.subn(r"(parameter integer %s\s*=\s*)[01]" % m.group(1), r"\g<1>" + m.group(2), v)
                if n != 1:
                    sys.exit("en: %s found %d times in src/project.v (need 1)" % (m.group(1), n))
                print("fallback ladder: %s = %s" % (m.group(1), m.group(2)))
            open("src/project.v", "w", encoding="utf-8").write(v)
        PY
          python3 ci/flow_pins.py --py "$(command -v python)" --tt tt --pdk-root /home/runner/pdk
        fi
        ./tt/tt_tool.py --create-user-config --pdk ihp-sg13cmos5l
