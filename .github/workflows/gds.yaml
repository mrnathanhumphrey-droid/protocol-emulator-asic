name: gds

on:
  push:
    # ⛔ WITHOUT THIS, EVERY COMMIT HARDENED THE SAME VERILOG. 10 gds runs across
    # 10 distinct commits in one day, most of them docs- or model-only, at 1+
    # hour each on a BILLED private repo. `git diff --name-only A B -- src/` was
    # empty for several of them.
    # ⭐ `test/**` IS IN THE LIST because `gl_test` runs inside THIS workflow --
    # a testbench change has to re-run it, and filtering it out would silently
    # stop gate-level testing on test-only commits.
    # ⛔⛔ AND NOW A BRANCH FILTER TOO, BECAUSE THE PATH FILTER WAS NOT
    # THE WHOLE PROBLEM. The harden takes ~3.5 h and the concurrency group
    # below cancels it on the next push, so in practice GATE-LEVEL RESULTS
    # ONLY LANDED IF NOBODY PUSHED FOR THREE AND A HALF HOURS -- three
    # hardens in a row were cancelled that way, each after real progress.
    # That made gate-level coverage a function of typing discipline rather
    # than of policy.
    # ⇒ Develop on `dev`, where `test` and the fast gates still run on
    #   every push; merge to `cmos5l` at a CHECKPOINT when a harden is
    #   wanted. The cancel behaviour then becomes a FEATURE: it only ever
    #   cancels a harden a newer checkpoint has superseded.
    branches:
      - cmos5l
    paths:
      - 'src/**'
      - 'test/**'
      - 'info.yaml'
      - '.github/workflows/gds.yaml'
  # ⭐ UNCHANGED, AND THE SUBMISSION CHECKLIST DEPENDS ON IT: a
  # manual dispatch on the final SHA is how the submission gets its
  # harden regardless of the branch or path filter.
  workflow_dispatch:

# ⭐ SUPERSEDED RUNS CANCEL THEMSELVES NOW. Three were cancelled by hand today;
# a hand-cancel is a watcher's job that nobody armed.
# ⚠ SUBMISSION CHECKLIST CONSEQUENCE, recorded where it will be read: with a
# `paths` filter a docs-only HEAD has NO gds run rather than a passing one, so
# the submitted SHA must be given one deliberately --
#   gh workflow run gds.yaml --ref <the exact submitted SHA>
# TT's precheck wants a green gds on the commit that is submitted.
concurrency:
  group: gds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ⛔⛔ SKIP A HARDEN THE SHA ALREADY HAS (Wilson). Fast-forwarding `cmos5l` to
  # a SHA that was already hardened by dispatch re-ran the same 3.5 h harden
  # on a billed private repo (38132276695, cancelled by hand). GitHub attaches
  # checks to the SHA, so that run proved nothing new.
  # ⛔ POSITIVE EVIDENCE ONLY: a run whose `gds` job was SKIPPED still ends
  # with overall conclusion "success", so "a successful run on this SHA" would
  # count a skip as a harden -- an absent result taken for a pass, the shape
  # that recurred three times in one arc. The check requires an EARLIER run
  # on this SHA whose `gds`, `precheck` AND `gl_test` jobs each concluded
  # `success`, and names it. A manual dispatch always hardens.
  already:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      green: ${{ steps.q.outputs.green }}
    steps:
      - id: q
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "dispatch: hardening on request"; echo "green=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          found=""
          for id in $(gh api "repos/$REPO/actions/workflows/gds.yaml/runs?head_sha=$SHA&per_page=50" \
                        --jq '.workflow_runs[] | select(.conclusion == "success") | .id'); do
            [ "$id" = "$RUN" ] && continue
            n=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
                  --jq '[.jobs[] | select((.name == "gds" or .name == "precheck" or .name == "gl_test") and .conclusion == "success")] | length')
            if [ "$n" = "3" ]; then found="$id"; break; fi
          done
          if [ -n "$found" ]; then
            echo "SKIP: $SHA already carries a green harden -- run $found (gds, precheck, gl_test all success)"
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "no green harden on $SHA yet -- hardening"
            echo "green=false" >> "$GITHUB_OUTPUT"
          fi

  gds:
    needs: already
    if: needs.already.outputs.green != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # ⛔ PINNED (Wilson 10-18): the action to a commit SHA (the ihp-cmos5l
      # branch head of 2026-09-14), and tt-support-tools to d66cf17 -- the
      # tools the timing of record was measured with (model/timing_of_record.json).
      # A branch ref resolves whatever the branch holds on the day; the harden
      # of record must run what was measured. model/gate_flow_config.py checks
      # both pins.
      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@3412659307918422f3f0727917cf9b499aaca588
        with:
          pdk: ihp-sg13cmos5l
          tools-ref: d66cf17

      # ⭐ THE HARDEN'S RECORD (Wilson 10-21): what this harden ran ON, so a
      # gate at the lock SHA can check the tree still matches it -- chip RTL,
      # flow config and the gl_test image set. A mismatch there is red and
      # the harden reruns; nothing is assumed from "only bench work landed".
      - name: Record what was hardened
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF' > harden_record.json
          import hashlib, json, os, re
          def h(paths):
              d = hashlib.sha256()
              for p in sorted(paths):
                  d.update(p.encode() + b"\0" + open(p, "rb").read() + b"\0")
              return d.hexdigest()
          rtl = sorted("src/" + f for f in os.listdir("src") if f.endswith(".v"))
          cfg = ["src/config.json", "info.yaml"]
          imgs = sorted({"test/" + m for m in re.findall(
              r'read_hex\("([^"]+)"\)', open("test/test.py", encoding="utf-8").read())})
          print(json.dumps({
              "sha": os.environ["GITHUB_SHA"], "run": os.environ["GITHUB_RUN_ID"],
              "chip_rtl": {"files": rtl, "sha256": h(rtl)},
              "flow_config": {"files": cfg, "sha256": h(cfg),
                              "action": "tt-gds-action@3412659307918422f3f0727917cf9b499aaca588",
                              "tools_ref": "d66cf17", "pdk": "ihp-sg13cmos5l"},
              "gl_test_images": {"files": imgs, "sha256": h(imgs)}}, indent=1))
          EOF
          cat harden_record.json
          { echo '### What this harden ran on'; echo '```json'; cat harden_record.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the harden record
        uses: actions/upload-artifact@v7
        with:
          name: harden-record-${{ github.sha }}
          path: harden_record.json

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@3412659307918422f3f0727917cf9b499aaca588
        with:
          tools-ref: d66cf17

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@3412659307918422f3f0727917cf9b499aaca588

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    # The repo is PRIVATE until submission and GitHub Pages is therefore not
    # enabled, so this job always fails with
    #   "Failed to create deployment (status: 404) ... Ensure GitHub Pages has
    #    been enabled"
    # It is kept (it works once Pages is on at submission) but made
    # non-blocking, because a PERMANENTLY RED JOB TRAINS YOU TO IGNORE CI -- and
    # the gds/precheck/gl_test results now matter, since real RTL has landed.
    # A standing red X is exactly where a genuine failure hides.
    continue-on-error: true
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@3412659307918422f3f0727917cf9b499aaca588
