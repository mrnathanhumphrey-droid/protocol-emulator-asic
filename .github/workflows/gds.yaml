name: gds

on:
  push:
    # ⛔ WITHOUT THIS, EVERY COMMIT HARDENED THE SAME VERILOG. 10 gds runs across
    # 10 distinct commits in one day, most of them docs- or model-only, at 1+
    # hour each on a BILLED private repo. `git diff --name-only A B -- src/` was
    # empty for several of them.
    # ⭐ `test/**` IS IN THE LIST because `gl_test` runs inside THIS workflow --
    # a testbench change has to re-run it, and filtering it out would silently
    # stop gate-level testing on test-only commits.
    # ⛔⛔ AND NOW A BRANCH FILTER TOO, BECAUSE THE PATH FILTER WAS NOT
    # THE WHOLE PROBLEM. The harden takes ~3.5 h and the concurrency group
    # below cancels it on the next push, so in practice GATE-LEVEL RESULTS
    # ONLY LANDED IF NOBODY PUSHED FOR THREE AND A HALF HOURS -- three
    # hardens in a row were cancelled that way, each after real progress.
    # That made gate-level coverage a function of typing discipline rather
    # than of policy.
    # ⇒ Develop on `dev`, where `test` and the fast gates still run on
    #   every push; merge to `cmos5l` at a CHECKPOINT when a harden is
    #   wanted. The cancel behaviour then becomes a FEATURE: it only ever
    #   cancels a harden a newer checkpoint has superseded.
    branches:
      - cmos5l
    paths:
      - 'src/**'
      - 'test/**'
      - 'info.yaml'
      - '.github/workflows/gds.yaml'
  # ⭐ UNCHANGED, AND THE SUBMISSION CHECKLIST DEPENDS ON IT: a
  # manual dispatch on the final SHA is how the submission gets its
  # harden regardless of the branch or path filter.
  workflow_dispatch:

# ⭐ SUPERSEDED RUNS CANCEL THEMSELVES NOW. Three were cancelled by hand today;
# a hand-cancel is a watcher's job that nobody armed.
# ⚠ SUBMISSION CHECKLIST CONSEQUENCE, recorded where it will be read: with a
# `paths` filter a docs-only HEAD has NO gds run rather than a passing one, so
# the submitted SHA must be given one deliberately --
#   gh workflow run gds.yaml --ref <the exact submitted SHA>
# TT's precheck wants a green gds on the commit that is submitted.
concurrency:
  group: gds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    # The repo is PRIVATE until submission and GitHub Pages is therefore not
    # enabled, so this job always fails with
    #   "Failed to create deployment (status: 404) ... Ensure GitHub Pages has
    #    been enabled"
    # It is kept (it works once Pages is on at submission) but made
    # non-blocking, because a PERMANENTLY RED JOB TRAINS YOU TO IGNORE CI -- and
    # the gds/precheck/gl_test results now matter, since real RTL has landed.
    # A standing red X is exactly where a genuine failure hides.
    continue-on-error: true
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
