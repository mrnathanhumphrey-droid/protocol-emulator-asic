name: docs

on:
  push:
    # ⛔ THE CI BUDGET (Nate 11-23): the datasheet builds only when what it is
    # built from changes, and only on the integration branches (see test.yaml).
    branches:
      - work/v2-final
      - a2/q16a
    paths:
      - 'docs/**'
      - 'info.yaml'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@e7a50f8f46f9f8df4b2c9935bfeb1cbc6b6ae4f6
        with:
          tools-ref: 9d13ff3e3e6202090740110438c6a10c1d62ca0f
