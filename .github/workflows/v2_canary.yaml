name: v2-canary
# ⛔⛔ v2 TIMING CANARIES ONLY (Wilson 10-20). A harden stopped after post-PnR
# STA, on a v2-* branch, run by hand -- the CI twin of the local canary
# (probe_c1/c1_run.sh: same PDK, tools, LibreLane and --to step).
#   * DISPATCH ONLY: no push / pull_request / schedule trigger, so nothing a
#     commit, a fork or a PR does can start it. GitHub requires a dispatchable
#     workflow to exist on the default branch; the job's `if:` makes it a
#     no-op anywhere but a v2-* branch of this repository.
#   * NO SECRETS: it reads nothing but public repositories; permissions are
#     read-only.
#   * SEPARATE from the lock: it never touches cmos5l, dev or gds.yaml (the
#     harden of record), and it changes no flow config -- each v2-* branch
#     carries its own src/config.json, hashed in the artifact.
#   * EVERY RESULT IS STAMPED with the branch SHA and the config hash.
#   ⚠ CI AND THE LOCAL CANARY ARE DIFFERENT ENVIRONMENTS: the same baseline
#     config measured -0.62 ns here and -1.05 ns locally. A CI result is judged
#     on its own terms (>= 0 at every corner), never mixed with a local one.
on:
  workflow_dispatch:
    inputs:
      label:
        description: "what this canary measures (copied into the summary)"
        required: true

permissions:
  contents: read

jobs:
  canary:
    if: startsWith(github.ref, 'refs/heads/v2-') && github.repository == 'mrnathanhumphrey-droid/protocol-emulator-asic'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      # 11-10 (Wilson): TT's release ttihp27a -- tt-support-tools main SHA,
      # LibreLane 3.1.0.dev4; the PDK comes through Ciel at LibreLane's pin,
      # which is ci/pdk.sha (89d42ee6), checked after the harden below
      TT_REF: 9d13ff3e3e6202090740110438c6a10c1d62ca0f
      LL_VER: 3.1.0.dev4
      PDK_ROOT: /home/runner/pdk
      PDK: ihp-sg13cmos5l
      TO_STEP: OpenROAD.STAPostPNR
    steps:
      - name: Checkout the v2 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ⛔⛔ A CANARY IS ONE COMMIT ON A WORK COMMIT (Wilson 11-03, B1). It is
      # built by ci/make_canary.py <density>, and this refuses anything else:
      # HEAD~1 must be on origin/work/latch-store, and HEAD may change only
      # src/config.json's PL_TARGET_DENSITY_PCT value and test.yaml's ignore
      # line -- so a canary hardens EXACTLY the work branch's design and config.
      - name: The canary is the work branch plus its density (B1)
        shell: bash
        run: python ci/make_canary.py --check

      - name: The pinned PDK commit (ci/pdk.sha)
        shell: bash
        run: echo "PDK_SHA=$(tr -d '[:space:]' < ci/pdk.sha)" >> "$GITHUB_ENV"

      - name: Stamp the inputs (branch, SHA, config hash)
        shell: bash
        env:
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          mkdir -p canary_out
          {
            echo "label   : ${LABEL}"
            echo "branch  : ${GITHUB_REF_NAME}"
            echo "sha     : ${GITHUB_SHA}"
            echo "config  : $(sha256sum src/config.json | cut -c1-64)  src/config.json"
            echo "info    : $(sha256sum info.yaml | cut -c1-64)  info.yaml"
            echo "tiles   : $(grep -E '^\s*tiles:' info.yaml)"
            echo "pdk     : ${PDK_SHA}"
            echo "tt-tools: ${TT_REF}   librelane ${LL_VER}"
          } | tee canary_out/stamp.txt

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache the pinned IHP PDK
        id: pdk
        uses: actions/cache@v4
        with:
          path: /home/runner/pdk
          key: ihp-open-pdk-${{ env.PDK_SHA }}

      # 11-10: no manual PDK fetch -- the tag's flow installs the PDK through
      # Ciel at LibreLane's own pin (the cache above keeps that install)

      - name: tt-support-tools and LibreLane (pinned)
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/TinyTapeout/tt-support-tools tt
          git -C tt checkout -q "$TT_REF"
          pip -q install -r tt/requirements.txt
          pip -q install "librelane==$LL_VER"
          echo "tt=$(git -C tt rev-parse --short HEAD) librelane=$(pip show librelane | awk '/^Version/{print $2}')" | tee -a canary_out/stamp.txt

      - name: Harden to post-PnR STA
        shell: bash
        run: |
          set -euo pipefail
          ./tt/tt_tool.py --create-user-config --pdk "$PDK"
          # LibreLane's --force-run-dir requires the directory to exist (the
          # local canary makes it too; its absence failed the first dispatch)
          rm -rf runs/wokwi && mkdir -p runs/wokwi
          T0=$(date +%s)
          python -m librelane --pdk-root "$PDK_ROOT" --docker-no-tty --dockerized \
            --pdk "$PDK" --run-tag wokwi --force-run-dir runs/wokwi \
            --hide-progress-bar --to "$TO_STEP" src/config_merged.json > canary_out/harden.log 2>&1
          echo "wall_s=$(( $(date +%s) - T0 ))" | tee -a canary_out/stamp.txt

      - name: The PDK Ciel installed is ci/pdk.sha
        shell: bash
        run: |
          set -euo pipefail
          # Ciel keeps $PDK_ROOT/ciel/<family>/versions/<commit>/ (ciel/common.py)
          got=$(ls -d "$PDK_ROOT"/ciel/*/versions/*/ 2>/dev/null | xargs -n1 basename | sort -u | tr '\n' ' ')
          echo "ciel versions: $got" | tee -a canary_out/stamp.txt
          ls -d "$PDK_ROOT"/ciel/*/versions/"$PDK_SHA" >/dev/null 2>&1 \
            || { echo "*** Ciel installed '$got', ci/pdk.sha says $PDK_SHA"; exit 1; }

      - name: Per-corner table
        if: always()
        shell: bash
        run: |
          python - <<'EOF' | tee canary_out/corners.txt
          import json, os
          p = "runs/wokwi/final/metrics.json"
          if not os.path.exists(p):
              print("NO metrics.json -- the harden did not reach the end")
              raise SystemExit(1)
          d = json.load(open(p))
          print("%-34s %10s %10s" % ("corner", "setup ws", "hold ws"))
          for c in sorted({k.split("corner:")[1] for k in d if "corner:" in k
                           and k.startswith("timing__setup__ws")}):
              print("%-34s %+10.4f %+10.4f" % (c, d["timing__setup__ws__corner:" + c],
                                               d["timing__hold__ws__corner:" + c]))
          for k in ("timing__setup__ws", "timing__setup_vio__count", "timing__hold__ws",
                    "timing__hold_vio__count", "design__instance__area__stdcell",
                    "design__instance__count", "design__instance__utilization"):
              print("%-34s %s" % (k, d.get(k)))
          EOF
          cp runs/wokwi/resolved.json canary_out/ 2>/dev/null || true
          echo "resolved: $(sha256sum canary_out/resolved.json 2>/dev/null | cut -c1-64)" >> canary_out/stamp.txt

      # ⛔ THE DENSITY SWEEP MUST BE REAL (Wilson 10-30). PIT chunk 2's three
      # canaries (59 / 60 / 61) came back BYTE-IDENTICAL: placement utilization
      # (62.9 %) was above every target, and global placement silently replaced
      # each with a uniform 0.63 (GPL-0302) -- one measurement reported as a
      # median of three. A run whose requested density was overridden is not a
      # sample of that density: it FAILS here, loudly, with the numbers.
      - name: Density sweep is real (no GPL-0302 override)
        shell: bash
        run: |
          echo "density : requested $(grep -o '"PL_TARGET_DENSITY_PCT": *[0-9]*' src/config.json | grep -o '[0-9]*$') %" | tee -a canary_out/stamp.txt
          grep -m1 'GPL-0019\] Utilization' canary_out/harden.log | sed 's/^.*Utilization: */density : placement utilization /' | tee -a canary_out/stamp.txt || true
          if grep -q 'GPL-0302' canary_out/harden.log; then
            grep -A1 'GPL-0302' canary_out/harden.log | head -2
            echo "density : OVERRIDDEN by global placement (GPL-0302) -- set PL_TARGET_DENSITY_PCT above the utilization" | tee -a canary_out/stamp.txt
            echo "::error::GPL-0302: the requested placement density was below utilization and was overridden; this run does not sample the density it names"
            exit 1
          fi
          echo "density : honoured (no GPL-0302)" | tee -a canary_out/stamp.txt

      # ⭐ THE FINAL GATE NETLIST (Wilson 10-28): a timing path whose endpoint
      # flop cannot be NAMED is half a measurement -- the reports give only
      # `_52602_`. The newest *.nl.v of the run, gzipped (one file, not every
      # step's copy), so a path's start/end instances map to RTL net names.
      - name: Keep the final netlist
        if: always()
        shell: bash
        run: |
          f=$(ls -t runs/wokwi/*/*.nl.v 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            gzip -c "$f" > canary_out/final.nl.v.gz
            echo "netlist: $f ($(wc -c < canary_out/final.nl.v.gz) bytes gz)" >> canary_out/stamp.txt
          else
            echo "netlist: NONE FOUND" >> canary_out/stamp.txt
          fi

      - name: Upload the canary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-canary-${{ github.ref_name }}-${{ github.sha }}
          path: |
            canary_out/
            runs/wokwi/final/metrics.json
            runs/wokwi/*-openroad-stapostpnr/*/*.rpt
