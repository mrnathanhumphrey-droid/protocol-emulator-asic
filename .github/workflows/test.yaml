name: test
on:
  push:
  # ⭐ A MANUAL DISPATCH IS THE FULL LN1 RUN (200k rows per arm); a push runs
  # 20k. A `schedule` would only ever fire on the default branch (cmos5l), i.e.
  # test the locked tree rather than dev, so the full run is dispatched by hand.
  workflow_dispatch:
    inputs:
      ln1_rows:
        description: "LN1 rows per arm (200000 = the full run)"
        default: "200000"
jobs:
  # ⛔⛔ LN1 -- THE LEAN REPLAY GATE (Wilson; spec from the Lean agent): the Lean
  # model's `step` replayed against traces EXPORTED HERE from the commit under
  # test (never stored CSVs), every arm held to a pinned signature -- the three
  # must-fires must fail for their EXPECTED reason, the 10 out-of-scope images
  # must stay out of scope at row 0 -- plus `#print axioms` on dstar, dstar29
  # and dstar39 == exactly [propext, Quot.sound]. Divergence = red.
  ln1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        # v2: full history -- ci/ln1_replay.py's declared STALE compares the
        # inputs against the v1-lock tag (model/stale_records.py)
        with:
          fetch-depth: 0

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # The SAME pinned suite as the test job, for its Verilator only: the
      # M_PFETCH_NOWAIT arm's seed-4 trace was chosen on this release.
      - name: Cache the pinned OSS CAD Suite
        id: osscad
        uses: actions/cache@v4
        with:
          path: /opt/oss-cad-suite
          key: oss-cad-suite-linux-x64-20260930

      - name: Download the pinned OSS CAD Suite
        if: steps.osscad.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL=https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-30/oss-cad-suite-linux-x64-20260930.tgz
          curl -fL --retry 3 -o /tmp/oss-cad-suite.tgz "$URL"
          sudo mkdir -p /opt/oss-cad-suite
          sudo tar -xzf /tmp/oss-cad-suite.tgz -C /opt/oss-cad-suite --strip-components=1

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      # Lean: elan + the toolchain cached on `lean-toolchain`, the build tree
      # on `lean-toolchain` + `lake-manifest.json` (lake rebuilds what changed).
      - name: Cache elan and the Lean toolchain
        id: elan
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/JLane/lean-toolchain') }}

      - name: Install elan
        if: steps.elan.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none

      - name: Put elan on PATH
        shell: bash
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache the Lean build tree
        uses: actions/cache@v4
        with:
          path: lean/JLane/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean/JLane/lean-toolchain', 'lean/JLane/lake-manifest.json') }}

      - name: LN1 replay gate (ci/ln1_replay.py)
        shell: bash
        env:
          PE_VERILATOR: /opt/oss-cad-suite/bin/verilator
        run: |
          python ci/ln1_replay.py --out ln1_out --record ln1_out/ln1_record.json \
            --rows ${{ github.event_name == 'workflow_dispatch' && inputs.ln1_rows || '20000' }}

      # ⭐ WHAT THE RUN READ (Wilson R4): a 200k dispatch's record is committed
      # as model/ln1_of_record.json, which model/gate_ln1_record.py holds to the tree
      - name: Upload the LN1 record
        uses: actions/upload-artifact@v7
        with:
          name: ln1-record-${{ github.sha }}
          path: ln1_out/ln1_record.json

      - name: Upload LN1 logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ln1-logs
          path: ln1_out/**/*.log


  # ⛔⛔ THE META-TEST'S SLOW TIER (3b, 10-24): each slow gate re-run with ONE
  # check stubbed to always pass must go RED (model/gate_meta.py). The local
  # suite runs only the fast tier; these rebuild and simulate, minutes each, so
  # CI owns them, one job per seam.
  # ⭐ THE MATRIX IS READ FROM gate_meta.SEAMS (`--list slow`), never typed
  # here: a seam added to the table is in CI with no workflow edit, and none
  # can drop out of CI silently.
  meta-seams:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      seams: ${{ steps.list.outputs.seams }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: List the slow seams
        id: list
        shell: bash
        run: |
          set -euo pipefail
          s="$(python model/gate_meta.py --list slow)"
          echo "slow seams: $s"
          [ "$s" != "[]" ] || { echo "*** no slow seams listed: RED"; exit 1; }
          echo "seams=$s" >> "$GITHUB_OUTPUT"

  meta-slow:
    needs: meta-seams
    runs-on: ubuntu-24.04
    timeout-minutes: 45            # gate_meta's own per-seam limit is 30 min
    strategy:
      fail-fast: false
      # ⚠ the account runs ~20 jobs at once across ALL repos (Wilson 10-25):
      # 7 gate shards + ln1 + cocotb + the list jobs + 8 seams stays under it
      max-parallel: 8
      matrix:
        seam: ${{ fromJSON(needs.meta-seams.outputs.seams) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      # the test job's toolchain, exactly (see its comments)
      - name: Install iverilog, verilator and yosys
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys

      - name: Cache the pinned OSS CAD Suite
        id: osscad
        uses: actions/cache@v4
        with:
          path: /opt/oss-cad-suite
          key: oss-cad-suite-linux-x64-20260930

      - name: Download the pinned OSS CAD Suite
        if: steps.osscad.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL=https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-30/oss-cad-suite-linux-x64-20260930.tgz
          curl -fL --retry 3 -o /tmp/oss-cad-suite.tgz "$URL"
          sudo mkdir -p /opt/oss-cad-suite
          sudo tar -xzf /tmp/oss-cad-suite.tgz -C /opt/oss-cad-suite --strip-components=1

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      # ⛔ 3d (10-25): THE GENERATED IMAGES, BY THE ONE RECIPE. census_image,
      # edge_image(_noto), five_image and stress_image are GENERATED, not
      # tracked; the test job gets them from the coverage sweep's
      # benchset.base_images(), and 7 seams here crashed on a fresh checkout
      # without them (dd2cb42) -- the failure benchset.py's docstring records.
      - name: Build the generated images (benchset.base_images)
        shell: bash
        run: |
          python -c "import sys; sys.path[:0] = ['test', 'model']; import benchset; \
            p = benchset.base_images(); [print('***', x) for x in p]; \
            print('generated images:', 'FAILED' if p else 'ok'); sys.exit(1 if p else 0)"

      - name: Meta-test seam ${{ matrix.seam }}
        shell: bash
        env:
          PE_VERILATOR: /opt/oss-cad-suite/bin/verilator
          PE_SBY: /opt/oss-cad-suite/bin/sby
          PE_OW_JOBS: "3"
        run: python model/gate_meta.py --seam "${{ matrix.seam }}"

  # ⛔⛔ A MATRIX IS GREEN ONLY IF EVERY EXPECTED LEG RAN GREEN (Wilson 10-25,
  # S1g at the CI layer): a leg that never started must not read as a pass.
  meta-complete:
    needs: [meta-seams, meta-slow]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Every slow seam reported green
        shell: bash
        run: |
          echo "meta-seams: ${{ needs.meta-seams.result }}  meta-slow: ${{ needs.meta-slow.result }}"
          [ "${{ needs.meta-seams.result }}" = "success" ] && [ "${{ needs.meta-slow.result }}" = "success" ] \
            || { echo "*** not every slow seam ran green: RED"; exit 1; }

  # ⛔⛔ THE SUITE AS SHARDS (10-25): ci/run_gates.sh --shard NAME, one job per
  # shard. The shard list is READ from ci/shards.txt (which ci/shards.py holds
  # to GATES exactly), never typed here.
  shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check and list the shards
        id: list
        shell: bash
        run: |
          set -euo pipefail
          python ci/shards.py check
          s="$(python ci/shards.py list)"
          echo "shards: $s"
          echo "shards=$s" >> "$GITHUB_OUTPUT"

  test:
    needs: shards
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # ⛔ TIMEOUTS (Wilson 11-02): a hang or a slow shard fails in this many
    # minutes and says so, not after GitHub's 6 hours. Sized from the LAST
    # measured CI run (41293526842, the latch store before its sim fix -- an
    # upper bound): cov 173 min, the rest <= 77. Tighten after the post-fix run.
    timeout-minutes: ${{ matrix.shard == 'cov' && 240 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.shards) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # ⛔ FULL HISTORY: run_cktx's must-fire reads the pre-fix silicon
          # with `git show ff60d45:src/pe_engine.v`. A shallow clone holds only
          # HEAD, so it passed while ff60d45 WAS the tip and went red on the
          # first push past it (54f010a).
          fetch-depth: 0

      # ⛔ THREE TOOLS, AND EACH IS LOAD-BEARING FOR A GATE THAT NOW RUNS HERE:
      #   iverilog  -- cocotb, and the parameter dump's first elaborator
      #   verilator -- the dump's SECOND elaborator. `gate_one_encoder` goes
      #                RED if it is absent, by design ("a tool that cannot
      #                elaborate the dump fails the gate"), so installing it is
      #                what makes the two-elaborator authority real in CI
      #                rather than degraded to one reading.
      #   yosys     -- the netlist the reset audit classifies flops from. That
      #                audit is RED without it, not skipped: an audit that
      #                cannot see the design has not audited it.
      - name: Install iverilog, verilator and yosys
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys

      # ⭐ SIGROK, PINNED, FOR test/run_ckack.py (Wilson 11-12, decision 5): its
      # bytes are judged by sigrok's own i2c decoder. Pinned by the UPSTREAM
      # versions the dev box decodes with (sigrok-cli 0.7.2, libsigrokdecode
      # 0.5.3); the Debian revision differs per Ubuntu release, so the step
      # asserts the upstream numbers and is red on anything else. A missing
      # sigrok makes run_ckack print NOT RUN, which is red.
      - name: "sim2: sigrok-cli (pinned: 0.7.2 / libsigrokdecode 0.5.3)"
        if: matrix.shard == 'sim2'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y sigrok-cli
          v=$(sigrok-cli --version)
          echo "$v" | head -6
          echo "$v" | grep -q '^sigrok-cli 0\.7\.2$' || { echo "*** sigrok-cli is not 0.7.2"; exit 1; }
          echo "$v" | grep -q 'libsigrokdecode 0\.5\.3' || { echo "*** libsigrokdecode is not 0.5.3"; exit 1; }

      # ⛔⛔ A PINNED VERILATOR, BECAUSE THE DISTRO'S IS TOO OLD AND BECAUSE THE
      # TWO ENVIRONMENTS MUST AGREE. cocotb 2.0.1 refuses to run on anything
      # below Verilator 5.036 ("cocotb requires Verilator 5.036 or later, but
      # using 5.032"), and apt here gives 5.020 while the dev box has 5.032 --
      # so the cocotb coverage arm could run NOWHERE, and the coverage gate was
      # measuring two different tools on the two sides.
      # ⚠ ONLY ITS VERILATOR IS ADOPTED. The same suite ships yosys 0.69 and
      # iverilog 14.0-devel, and both feed PUBLISHED numbers -- the yosys
      # ⛔⛔ AND ITS IVERILOG CANNOT BUILD THIS DESIGN AT ALL, which is a
      # stronger reason than the policy one. MEASURED: iverilog 14.0 (devel)
      # (s20260301-500-g2e81fcccb-dirty) gives 8 elaboration errors --
      # "Unable to bind parameter `LW' in `tb.user_project.u_eng'",
      # "Unable to bind wire/reg/memory `a_q'", "... `primed'" -- where apt's
      # release iverilog elaborates it cleanly. ⭐ ATTRIBUTED WITH A CONTROL
      # ARM, not assumed: the identical 8 errors appear at HEAD and at the
      # committed tree, and all 8 are in pe_engine.v, so they are the TOOL and
      # not any local edit. ⇒ Do not "upgrade" the suite's iverilog onto PATH
      # expecting the cocotb suite to run; it will not elaborate.
      # netlist drives the reset audit's flop classification and allowlist,
      # while `cj_measured.txt` (including the open hdr_cyc 92-vs-91 finding)
      # is an iverilog 12.0 measurement. Those move only with a measured diff,
      # and the yosys authority is the version the HARDENING FLOW uses, not the
      # newest one. So `PE_VERILATOR` names a binary and nothing goes on PATH.
      # ⭐ PINNED BY DATE AND CACHED BY DATE: a floating "latest" would make the
      # toggle ceilings -- exact point counts -- drift on their own, and 5.053
      # already emits ~2x the toggle points of 5.032 plus a conditional-
      # expression point class that 5.032 did not have.
      - name: Cache the pinned OSS CAD Suite
        id: osscad
        uses: actions/cache@v4
        with:
          path: /opt/oss-cad-suite
          key: oss-cad-suite-linux-x64-20260930

      - name: Download the pinned OSS CAD Suite
        if: steps.osscad.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL=https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-30/oss-cad-suite-linux-x64-20260930.tgz
          curl -fL --retry 3 -o /tmp/oss-cad-suite.tgz "$URL"
          sudo mkdir -p /opt/oss-cad-suite
          sudo tar -xzf /tmp/oss-cad-suite.tgz -C /opt/oss-cad-suite --strip-components=1

      - name: Report the pinned Verilator
        shell: bash
        run: |
          /opt/oss-cad-suite/bin/verilator --version
          echo "apt verilator (NOT used by the sweep): $(verilator --version)"
          echo "yosys stays at: $(yosys -V | head -1)"
          echo "iverilog stays at: $(iverilog -V | head -1)"

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      # ⛔ THE GENERATED IMAGES, BY THE ONE RECIPE (3d's lesson, again): the
      # unsharded run got them from the coverage sweep, which only the `cov`
      # shard runs now -- every shard builds them first.
      - name: Build the generated images (benchset.base_images)
        shell: bash
        run: |
          python -c "import sys; sys.path[:0] = ['test', 'model']; import benchset; \
            p = benchset.base_images(); [print('***', x) for x in p]; \
            print('generated images:', 'FAILED' if p else 'ok'); sys.exit(1 if p else 0)"

      # ⛔⛔ THE MODEL GATES RUN IN CI, THROUGH ONE ENTRY POINT.
      # `ci/run_gates.sh` is the ONLY thing this workflow calls for them, and
      # it is the same script run by hand before reporting green (Wilson's
      # ruling 2). It owns the gate list, the netlist step and the per-gate
      # preconditions.
      # ⚠ WHY, FROM A REAL FAILURE: the gate list used to live HERE as a shell
      # loop AND in whatever was typed at a prompt. A local run reported "all
      # 8 gates green", the push went red on `gate_stored_numbers`, and the
      # cause was neither the list nor the environment -- the local run had
      # happened before the last edits. Reproduced afterwards in a clean
      # worktree at that commit: it fails there too. Two lists invite drift
      # and a stale result invites a false report, so the script carries the
      # list once and prints a DIRTY-TREE warning every run.
      # ⛔ WHAT IT DELIBERATELY DOES NOT COVER, declared in the script too:
      # the clean room and the simulation sweeps (minutes each, and the clean
      # room moves files about), and every pyRTA-PRIMARY gate -- pyRTA is not
      # vendored, reached via PYRTA_SRC, and those gates are RED by design
      # without it rather than degrading to our own recurrence.
      # `model/a2/run_a2.py` is their harness, by hand at each checkpoint.
      # ⭐ THE PDK's STDCELL VERILOG, AT THE PINNED PDK COMMIT (ci/pdk.sha, the
      # one the canaries harden with; Wilson 11-03, A1). The bound store's
      # gates -- gate_store_latch, run_pit_capture, the two lints -- run the
      # tapeout bindings (PE_IHP_CELLS) on the PDK's own cell models. Only
      # libs.ref/sg13cmos5l_stdcell/verilog is fetched (sparse), and cached by
      # the pin. A missing file is COULD NOT RUN in those gates -- red.
      - name: Cache the PDK's stdcell Verilog (pinned)
        id: pdkv
        uses: actions/cache@v4
        with:
          path: /home/runner/pdk_stdcell
          key: ihp-sg13cmos5l-stdcell-verilog-${{ hashFiles('ci/pdk.sha') }}
      - name: Fetch the PDK's stdcell Verilog (sparse, pinned)
        if: steps.pdkv.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sha=$(tr -d '[:space:]' < ci/pdk.sha)
          mkdir -p /home/runner/pdk_stdcell && cd /home/runner/pdk_stdcell
          git init -q
          git remote add origin https://github.com/IHP-GmbH/IHP-Open-PDK.git
          git sparse-checkout set --no-cone /ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/verilog/
          git fetch -q --depth 1 --filter=blob:none origin "$sha"
          git checkout -q FETCH_HEAD
          ls -l ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/verilog/

      # ⭐⭐ LIBRELANE'S OWN SYNTHESIS, FOR model/gate_select_copies.py -- IN THE
      # FAST SHARD (Wilson 11-12: ~2.5 min setup + 2-4 min synthesis is fine
      # there). The generic netlist reads keep and no-keep the same, so the s12
      # select merge is invisible to it. Same pins as gds.yaml / v2_canary.yaml:
      # tt-support-tools 9d13ff3, LibreLane 3.1.0.dev4 dockerized, the PDK
      # through Ciel at LibreLane's pin, checked against ci/pdk.sha after.
      # ⚠ THE IMAGE IS 7.6 GB LOADED: the runner's preinstalled SDKs go first.
      # ⛔ CACHES ARE RESTORE + SAVE, the save under always() (Wilson 11-12):
      # actions/cache's built-in save is skipped when the job fails, so a red
      # gate would have re-pulled the image on every run, forever.
      # ⚠ tt/ is cloned OUTSIDE the checkout and PDK_ROOT is NOT exported: the
      # other fast gates must see neither (the lints read PDK_ROOT).
      - name: "llsyn: free runner disk for the LibreLane image"
        if: matrix.shard == 'fast'
        shell: bash
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: "llsyn: the pinned PDK commit (ci/pdk.sha)"
        if: matrix.shard == 'fast'
        shell: bash
        run: echo "PDK_SHA=$(tr -d '[:space:]' < ci/pdk.sha)" >> "$GITHUB_ENV"
      - name: "llsyn: restore the pinned IHP PDK"
        id: llpdk
        if: matrix.shard == 'fast'
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/pdk
          key: ihp-open-pdk-${{ env.PDK_SHA }}
      - name: "llsyn: restore the LibreLane image"
        id: llimg
        if: matrix.shard == 'fast'
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/llimg
          key: librelane-image-3.1.0.dev4
      - name: "llsyn: tt-support-tools, LibreLane and its image (pinned)"
        if: matrix.shard == 'fast'
        shell: bash
        env:
          TT_REF: 9d13ff3e3e6202090740110438c6a10c1d62ca0f
          LL_VER: 3.1.0.dev4
        run: |
          set -euo pipefail
          T0=$(date +%s)
          git clone -q https://github.com/TinyTapeout/tt-support-tools "$HOME/tt"
          git -C "$HOME/tt" checkout -q "$TT_REF"
          pip -q install -r "$HOME/tt/requirements.txt"
          pip -q install "librelane==$LL_VER"
          IMG="ghcr.io/librelane/librelane:$LL_VER"
          if [ -f /home/runner/llimg/image.tar.zst ]; then
            echo "image: cache hit ($(du -h /home/runner/llimg/image.tar.zst | cut -f1))"
            zstd -dc /home/runner/llimg/image.tar.zst | docker load
            rm -f /home/runner/llimg/image.tar.zst     # a hit is never re-saved
          else
            echo "image: cache miss -- pulling, then saving for the cache"
            docker pull -q "$IMG"
            mkdir -p /home/runner/llimg
            docker save "$IMG" | zstd -T0 -3 -q -o /home/runner/llimg/image.tar.zst
            echo "image: cached tarball $(du -h /home/runner/llimg/image.tar.zst | cut -f1)"
          fi
          docker image inspect "$IMG" --format 'image: {{.Id}}'
          echo "tt=$(git -C "$HOME/tt" rev-parse --short HEAD) librelane=$(pip show librelane | awk '/^Version/{print $2}')"
          echo "llsyn setup wall_s=$(( $(date +%s) - T0 ))"
          { echo "PE_LL_PDK_ROOT=/home/runner/pdk"; echo "PE_TT_DIR=$HOME/tt"; } >> "$GITHUB_ENV"

      - name: Model gates (ci/run_gates.sh)
        shell: bash
        # ⭐ THE PINNED VERILATOR, NAMED NOT PATHED, so the sweep and the cocotb
        # arm use the SAME binary here as on the dev box while yosys and
        # iverilog stay exactly as apt installed them. Without this the two
        # halves of the coverage gate ran on different tools inside one gate
        # run, and it failed on a point only the newer release emits.
        env:
          PE_VERILATOR: /opt/oss-cad-suite/bin/verilator
          # the formal-miter gate's SymbiYosys, from the same pinned suite; its
          # bin dir goes on PATH for the sby run only (its yosys + yices prove)
          PE_SBY: /opt/oss-cad-suite/bin/sby
          # CE5's 1-Wire gate runs its simulations 3 at a time (~4 min serial)
          PE_OW_JOBS: "3"
          # the bound store (Wilson 11-03): the PDK's cell models, and the
          # pinned suite's iverilog 14 for THOSE arms only -- it drives the
          # models' $setuphold-delayed nets; apt's stays the suite's iverilog
          PE_PDK_STDCELL_VERILOG: /home/runner/pdk_stdcell/ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/verilog
          PE_IVERILOG_CELLS: /opt/oss-cad-suite/bin/iverilog
          PE_VVP_CELLS: /opt/oss-cad-suite/bin/vvp
        run: |
          set -o pipefail
          bash ci/run_gates.sh --shard "${{ matrix.shard }}" 2>&1 | tee gates.log
          mkdir -p shard_out
          grep -E "^  GATES: " gates.log > "shard_out/${{ matrix.shard }}.txt"

      # llsyn: the netlist the gate judged came from the PDK of record
      - name: "llsyn: the PDK Ciel installed is ci/pdk.sha"
        if: always() && matrix.shard == 'fast'
        shell: bash
        run: |
          set -euo pipefail
          got=$(ls -d "$PE_LL_PDK_ROOT"/ciel/*/versions/*/ 2>/dev/null | xargs -n1 basename | sort -u | tr '\n' ' ')
          echo "ciel versions: $got"
          ls -d "$PE_LL_PDK_ROOT"/ciel/*/versions/"$PDK_SHA" >/dev/null 2>&1 \
            || { echo "*** Ciel installed '$got', ci/pdk.sha says $PDK_SHA"; exit 1; }
      # ⛔ SAVED WHETHER OR NOT THE GATES PASSED (Wilson 11-12); only on a miss --
      # a key that exists cannot be overwritten. The image tarball exists only on
      # a miss (a hit deletes it after loading).
      - name: "llsyn: save the LibreLane image"
        if: always() && matrix.shard == 'fast' && steps.llimg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/llimg
          key: librelane-image-3.1.0.dev4
      - name: "llsyn: save the pinned IHP PDK"
        if: always() && matrix.shard == 'fast' && steps.llpdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/pdk
          key: ihp-open-pdk-${{ env.PDK_SHA }}

      # the shard's own GATES line, read back by gates-complete
      - name: Upload the shard verdict
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.shard }}
          path: shard_out/${{ matrix.shard }}.txt

  # ⛔⛔ THE SUITE IS GREEN ONLY IF EVERY SHARD RAN GREEN (Wilson 10-25; S1g at
  # the CI layer). `needs` alone is not enough: each shard's OWN verdict line is
  # read back, every listed shard must have one, and each must say N of N.
  gates-complete:
    needs: [shards, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Every shard reported green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHARDS: ${{ needs.shards.outputs.shards }}
        run: |
          set -uo pipefail
          echo "shards: ${{ needs.shards.result }}  test: ${{ needs.test.result }}"
          rc=0
          [ "${{ needs.shards.result }}" = "success" ] || { echo "*** the shard list job did not succeed"; rc=1; }
          [ "${{ needs.test.result }}" = "success" ] || { echo "*** not every shard job succeeded"; rc=1; }
          gh run download "${{ github.run_id }}" -R "${{ github.repository }}" -p 'shard-*' -D verdicts || true
          # ⛔ NO COMMAND HERE MAY FAIL: Actions runs `bash -e`, and the red-path
          # probe (10-25) showed a missing verdict file ABORTING the loop at the
          # first absent shard -- red for a crash, not for its named reason, and
          # every later shard left unchecked. Existence is tested, never `ls`ed.
          for s in $(echo "${SHARDS:-[]}" | tr -d '[]",' ); do
            f="verdicts/shard-$s/$s.txt"
            line=""
            [ -f "$f" ] && line="$(cat "$f")"
            if printf '%s' "$line" | grep -qE "GATES: ([0-9]+) of \1 passed"; then
              echo "  ok   $s: $line"
            else
              echo "  ***  $s: ${line:-NO VERDICT -- the shard never reported}"; rc=1
            fi
          done
          [ -n "$(echo "${SHARDS:-}" | tr -d '[]", ')" ] || { echo "*** no shards listed"; rc=1; }
          [ $rc -eq 0 ] && echo "  every shard green: the suite is green" || echo "  SUITE: RED"
          exit $rc

  # the cocotb suite (test/Makefile), its own job now the gates are sharded
  cocotb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      # ⛔⛔ info.yaml AND test/Makefile MUST NAME THE SAME SOURCES. The Makefile
      # builds what CI TESTS; info.yaml lists what the flow HARDENS. A
      # divergence means the tests pass on one design and the chip is built from
      # another, and neither tool would say so. A third, STALE copy in
      # test/run_local.py had already broken the local runner outright.
      - name: Source lists agree (info.yaml vs test/Makefile)
        run: |
          python -c "import sys; sys.path.insert(0, 'test'); import run_local; \
            s = run_local.project_sources(); run_local.assert_info_yaml_agrees(s); \
            print('source lists agree:', ' '.join(s))"

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
