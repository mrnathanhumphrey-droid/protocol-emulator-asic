name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # ⛔ THREE TOOLS, AND EACH IS LOAD-BEARING FOR A GATE THAT NOW RUNS HERE:
      #   iverilog  -- cocotb, and the parameter dump's first elaborator
      #   verilator -- the dump's SECOND elaborator. `gate_one_encoder` goes
      #                RED if it is absent, by design ("a tool that cannot
      #                elaborate the dump fails the gate"), so installing it is
      #                what makes the two-elaborator authority real in CI
      #                rather than degraded to one reading.
      #   yosys     -- the netlist the reset audit classifies flops from. That
      #                audit is RED without it, not skipped: an audit that
      #                cannot see the design has not audited it.
      - name: Install iverilog, verilator and yosys
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      # ⛔⛔ info.yaml AND test/Makefile MUST NAME THE SAME SOURCES. The Makefile
      # builds what CI TESTS; info.yaml lists what the flow HARDENS. A
      # divergence means the tests pass on one design and the chip is built from
      # another, and neither tool would say so. A third, STALE copy in
      # test/run_local.py had already broken the local runner outright.
      - name: Source lists agree (info.yaml vs test/Makefile)
        run: |
          python -c "import sys; sys.path.insert(0, 'test'); import run_local; \
            s = run_local.project_sources(); run_local.assert_info_yaml_agrees(s); \
            print('source lists agree:', ' '.join(s))"

      # ⛔⛔ THE MODEL GATES RUN IN CI, NOT WHEN SOMEONE REMEMBERS THEM.
      # These five were by-hand only, which is the stored-record problem in
      # another form: a check that runs when someone thinks of it is a check
      # whose last green result has no date. Four of them are pure Python and
      # the fifth (one-encoder) needs only iverilog, which is already
      # installed above for the cocotb run.
      # ⚠ `gate_one_encoder` also reads Verilator as a SECOND elaborator and
      # degrades to iverilog-only when it is absent; that is its own declared
      # behaviour, and CI therefore exercises the single-elaborator path. The
      # two-elaborator reading stays a local/by-hand check.
      # ⭐ `gate_j_program.py` JOINED THEM, and the reason is specific: it now
      # carries the §6.1 check from `docs/PREREG_C_SAT.md` -- the ten live
      # measurements that RETRACTED the universal `J = 8` must stay visible
      # even though the corrected admissibility condition takes seven of them
      # out of scope. A guard against a retraction being quietly re-opened
      # should not depend on somebody remembering to run it. It also holds the
      # recorded violation COUNT, so an edit that drops one goes red.
      # ⛔ NOT INCLUDED HERE: the clean room (it moves files about and runs
      # benches) and the parameter-point sweep plus run_spl_compare (minutes
      # of simulation each). Those stay by-hand at each `cmos5l` checkpoint,
      # and that is a declared boundary rather than an oversight.
      # ⚠ NOR `gate_c3_requote.py`, AND THAT IS A REAL GAP, not a preference:
      # pyRTA is the PRIMARY bound, it is NOT VENDORED (reached via PYRTA_SRC),
      # and the gate is RED by design without it rather than falling back to
      # our own recurrence. So the C = 3 re-quote is checked by `run_a2.py` at
      # each checkpoint and not on every push. The same is already true of
      # every other pyRTA-primary gate.
      # the netlist the reset audit reads, via the SAME script the local flow
      # uses -- its output directory is an argument for exactly this reason
      - name: Netlist for the reset audit
        shell: bash
        run: bash test/local_netlist.sh "$PWD" "" local_netlist /tmp

      - name: Model gates
        shell: bash
        env:
          PE_NETLIST_JSON: /tmp/local_netlist.json
        run: |
          set -e
          for g in model/gate_ruling_audit.py \
                   model/gate_one_encoder.py \
                   model/gate_mutant_arms.py \
                   model/gate_reset_audit.py \
                   model/gate_stored_numbers.py \
                   model/gate_bench_indices.py \
                   model/gate_j_proof_anchors.py \
                   model/a2/gate_j_program.py \
                   model/pe_asm.py ; do
            echo "=== $g ==="
            python "$g"
          done

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
