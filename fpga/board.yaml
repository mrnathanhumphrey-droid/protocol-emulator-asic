# The FPGA board target (Wilson 11-03): Puzhi PA100T-EDU.
# ⛔ THE ONLY PLACE THE BOARD'S CLOCK IS WRITTEN DOWN. `model/clock.py` reads it
# as target `fpga`; fpga/pa100t/build.tcl passes it to pe_fpga_core as CLK_HZ;
# `model/gate_clock_consistency.py` checks it against the MMCM in
# fpga/pa100t/pa100t_top.v (200 MHz in, x6 / 20 out).
# F2 (Wilson): 60 MHz, the chip's own clock (info.yaml) -- the board now runs
# the design at the rate it tapes out at.
board:        "PA100T-EDU"
clock_hz:     60000000
